name: FormatJet build

# FormatJet's fork: builds and tests the formatjet branch and its pull requests, and turns
# each `<upstream version>-fj.<n>` tag into a GitHub release with the CLI jar and its SHA-256,
# which FormatJet's engine image pins. Upstream's own workflows are left as they are, so
# rebasing on upstream stays clean: their release only runs on `v*` tags and their snapshot
# publishing needs secrets this fork doesn't have.

on:
  push:
    branches: [formatjet]
    tags: ['*-fj.*']
  pull_request:
    branches: [formatjet]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: formatjet-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-wqy-zenhei fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "gradle=-Pofficeconvert.version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "gradle=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test
        run: ./gradlew build ${{ steps.v.outputs.gradle }} --no-daemon --stacktrace
      - name: Name the CLI jar and checksum it
        run: |
          mkdir -p dist
          cp cli/build/libs/stirling-office-convert-cli.jar "dist/stirling-office-convert-cli-${{ steps.v.outputs.version }}.jar"
          cd dist && sha256sum ./*.jar | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ steps.v.outputs.version }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "FormatJet build of Stirling Office Convert, from the formatjet branch. Check the jar against SHA256SUMS. Changes from upstream are listed in FORMATJET.md."
